name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore shared debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLDSMS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/foldsms-debug.p12"
            echo "FOLDSMS_KEYSTORE_FILE=$RUNNER_TEMP/foldsms-debug.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::FOLDSMS_KEYSTORE_BASE64 is not set; this APK uses a one-off debug key and cannot update an installed build."
          fi
      - name: Unit tests, Android lint, and debug APK
        env:
          FOLDSMS_KEYSTORE_PASSWORD: ${{ secrets.FOLDSMS_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|DN"
          rm -f "$RUNNER_TEMP/foldsms-debug.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: FoldSMS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  interaction-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated API 35 interaction and storage tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb -s emulator-5554 shell wm size 1856x2160
            adb -s emulator-5554 shell wm density 320
            bash scripts/ci-run-instrumentation.sh
            bash scripts/ci-sms-receive-smoke.sh
      - name: Print failing test details
        if: failure()
        run: |
          for f in app/build/outputs/androidTest-results/connected/*/*.xml app/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$f" ] && grep -h -B1 -A14 '<failure' "$f" | cut -c1-400 | head -400
          done || true
      - name: Upload interaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FoldSMS-interaction-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/sms-receive-smoke.txt
            app/build/reports/flaky-retries.txt
            app/build/reports/emulator-logcat.txt
          retention-days: 7
          if-no-files-found: warn
